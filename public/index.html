<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06243a;overscroll-behavior:none}
  body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #scene{visibility:hidden;pointer-events:none}
  #scene.fallback{visibility:visible;pointer-events:auto}
  #gl{z-index:1}
  #buddy{z-index:2;pointer-events:none}
  #hint{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);z-index:3;pointer-events:none;color:#eafcff;font-size:clamp(1rem,3.6vw,1.35rem);letter-spacing:.12em;
    text-transform:uppercase;text-shadow:0 2px 12px rgba(0,30,50,.9);animation:breathe 2.6s ease-in-out infinite;transition:opacity .8s}
  #hint.gone{opacity:0;animation:none}
  @keyframes breathe{0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
  #toast{position:fixed;left:50%;top:14%;transform:translate(-50%,0) scale(.9);z-index:3;pointer-events:none;opacity:0;color:#fff;font-weight:800;
    font-size:clamp(1.6rem,7vw,3.2rem);letter-spacing:.04em;text-shadow:0 0 22px rgba(120,220,255,.9),0 4px 0 rgba(0,40,70,.8)}
  #toast.show{animation:toast 1.8s ease forwards}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-12px) scale(1)}}
  #credit{position:fixed;right:8px;bottom:6px;z-index:3;pointer-events:none;color:rgba(220,245,255,.55);font-size:11px}
  @media (prefers-reduced-motion:reduce){#hint{animation:none}}
</style>

<body>
<canvas id="scene" aria-label="Aquarium with swimming fish"></canvas>
<canvas id="gl" aria-label="Touch the water to make liquid ripples and color blooms. Double-tap to change the flow."></canvas>
<canvas id="buddy" aria-hidden="true"></canvas>
<div id="hint">touch the water</div>
<div id="toast" aria-live="polite"></div>
<div id="credit">Jazz: “Jazz Improvisation” by Alex McCulloch (CC0)</div>
