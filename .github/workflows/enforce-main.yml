name: Enforce main-only repository

on:
  create:

permissions:
  contents: write

jobs:
  remove-extra-branch:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CREATED_REF: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_ref=$(printf '%s' "$CREATED_REF" | jq -sRr @uri)
          curl --fail-with-body \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/$encoded_ref"
